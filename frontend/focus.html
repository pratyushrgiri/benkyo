<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Focus - Benkyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500..700;1,500..700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/focus.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/timer.js" defer></script>
    <script src="js/focus.js" defer></script>
  </head>
  <body>
    <header class="top-bar">
      <h1>Focus</h1>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main class="container">
      <section class="timer-card">
        <label>
          Subject
          <select id="subject-select"></select>
        </label>
        <div id="timer-display" class="timer-display">25:00</div>
        <p id="timer-mode">Focus</p>

        <div class="timer-buttons">
          <button id="start-btn" class="icon-btn" title="Start" aria-label="Start focus session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4" /></svg>
            <span class="icon-btn-label">Start</span>
          </button>
          <button id="pause-btn" class="icon-btn" disabled title="Pause" aria-label="Pause session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="4" x2="7" y2="20" /><line x1="17" y1="4" x2="17" y2="20" /></svg>
            <span class="icon-btn-label">Pause</span>
          </button>
          <button id="resume-btn" class="icon-btn" disabled title="Resume" aria-label="Resume session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4" /></svg>
            <span class="icon-btn-label">Resume</span>
          </button>
          <button id="stop-btn" class="icon-btn" disabled title="Stop" aria-label="Stop session">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" /></svg>
            <span class="icon-btn-label">Stop</span>
          </button>
        </div>

        <div class="timer-buttons secondary">
          <button id="start-break-btn" class="icon-btn" disabled title="Start break" aria-label="Start break">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z" /><path d="M17 9h1.5a2.5 2.5 0 0 1 0 5H17" /><line x1="7" y1="3" x2="7" y2="5" /><line x1="11" y1="3" x2="11" y2="5" /></svg>
            <span class="icon-btn-label">Break</span>
          </button>
          <button id="skip-break-btn" class="icon-btn" disabled title="Skip break" aria-label="Skip break">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 15 12 6 20 6 4" /><line x1="18" y1="4" x2="18" y2="20" /></svg>
            <span class="icon-btn-label">Skip</span>
          </button>
        </div>
      </section>

      <section class="progress-card">
        <h3>Today's Goal</h3>
        <p id="goal-text">0m / 0m</p>
        <div class="progress-bar"><div id="goal-progress" class="progress-fill"></div></div>
        <p id="motivation"></p>
      </section>
    </main>
  </body>
</html>
