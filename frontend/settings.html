<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings - Benkyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500..700;1,500..700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/settings.js" defer></script>
  </head>
  <body>
    <header class="top-bar">
      <h1>Settings</h1>
      <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="focus.html">Focus</a>
        <a href="history.html">History</a>
      </nav>
    </header>

    <main class="container">
      <form id="settings-form" class="settings-form">
        <h2>Timer</h2>
        <label>Focus duration (minutes) <input type="number" name="focusMinutes" min="1" required /></label>
        <label>Short break (minutes) <input type="number" name="shortBreakMinutes" min="1" required /></label>
        <label>Long break (minutes) <input type="number" name="longBreakMinutes" min="1" required /></label>
        <label>Sessions before long break <input type="number" name="sessionsBeforeLongBreak" min="1" required /></label>

        <h2>Daily Goal</h2>
        <label>Daily focus goal (minutes) <input type="number" name="dailyGoalMinutes" min="1" required /></label>

        <h2>Sound</h2>
        <label><input type="checkbox" name="timerCompletion" /> Timer completion sound</label>
        <label><input type="checkbox" name="breakCompletion" /> Break completion sound</label>
        <label><input type="checkbox" name="buttonSounds" /> Button sounds</label>
        <label>Volume <input type="range" name="volume" min="0" max="100" /></label>

        <h2>Account</h2>
        <label>Username <input type="text" name="username" /></label>
        <label>Email <input type="email" name="email" /></label>

        <h2>Subjects</h2>
        <label>New subject <input type="text" name="newSubject" /></label>
        <button id="add-subject-btn" type="button" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="20" /><line x1="4" y1="12" x2="20" y2="12" /></svg>
          <span class="icon-btn-label">Add subject</span>
        </button>
        <ul id="subject-list"></ul>

        <div class="actions">
          <button type="submit">Save settings</button>
          <button id="logout-btn" type="button" class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" /></svg>
            <span class="icon-btn-label">Logout</span>
          </button>
        </div>
      </form>
      <p id="settings-message" class="message"></p>
    </main>
  </body>
</html>
