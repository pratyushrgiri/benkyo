<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Benkyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500..700;1,500..700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
  </head>
  <body>
    <main class="auth-page">
      <section class="auth-card">
        <h1>Benkyo</h1>
        <p>Welcome back.</p>
        <form id="login-form">
          <label>
            Email or Username
            <input type="text" name="identifier" required />
          </label>
          <label>
            Password
            <input type="password" name="password" required />
          </label>
          <button type="submit">Login</button>
        </form>
        <p id="auth-message" class="message"></p>
        <p>New here? <a href="register.html">Create account</a></p>
      </section>
    </main>
  </body>
</html>
