<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Benkyo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,500..700;1,500..700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <script src="js/api.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/dashboard.js" defer></script>
  </head>
  <body>
    <header class="top-bar">
      <h1>Benkyo</h1>
      <nav>
        <a href="focus.html">Focus</a>
        <a href="history.html">History</a>
        <a href="settings.html">Settings</a>
      </nav>
    </header>

    <main class="container">
      <section class="hero">
        <p id="welcome" class="label">Hello.</p>
        <div class="streak-badge">
          <span id="current-streak">0</span>
          <span class="streak-label">Day Streak</span>
        </div>
        <p class="focus-today"><span id="today-focus">0m</span> focused today</p>
        <a href="focus.html" class="btn-cta">
          Let's focus
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12" /><polyline points="13 5 20 12 13 19" /></svg>
        </a>
      </section>

      <section class="activity-card">
        <h3>Activity</h3>
        <div id="activity-graph" class="activity-graph"></div>
      </section>

      <section class="stats-card">
        <h3>Stats</h3>
        <ul>
          <li>Total focus <span id="total-focus">0m</span></li>
          <li>Completed sessions <span id="total-sessions">0</span></li>
          <li>Longest streak <span id="longest-streak">0</span></li>
          <li>Most studied subject <span id="most-subject">-</span></li>
        </ul>
      </section>

      <section class="achievements-card">
        <h3>Achievements</h3>
        <ul id="achievements-list"></ul>
      </section>
    </main>
  </body>
</html>
